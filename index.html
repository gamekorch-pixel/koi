<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קוי · הזמנת סושי</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1e2430;--mut:#7a8190;--acc:#ff5a4e;--acc2:#1e2430;--ok:#2fa36b;--line:#eee8df;--sh:0 8px 30px rgba(30,36,48,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--ink:#f3efe8;--mut:#9aa1ae;--line:#2a303b;--acc2:#f3efe8}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--ink:#f3efe8;--mut:#9aa1ae;--line:#2a303b;--acc2:#f3efe8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Assistant",system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;transition:transform .15s,background .2s}
button:active{transform:scale(.95)}
input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:auto;padding:18px 20px 130px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.brand b{color:var(--acc)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:14px}
.hero{margin:26px 0 18px}.hero h1{font-size:clamp(34px,6vw,56px);margin:0;letter-spacing:-1.5px;line-height:1.05}
.hero p{color:var(--mut);margin:8px 0 0;font-size:17px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:12px 22px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--acc2);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh);overflow:hidden;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.pic{height:150px;display:grid;place-items:center;font-size:76px;background:linear-gradient(135deg,#ffe9e2,#fff3d9);cursor:pointer;background-size:cover;background-position:center;transition:transform .3s}
.card:hover .pic{transform:scale(1.03)}
.cb{padding:14px 16px 16px}.cb h3{margin:0;font-size:19px}.cb p{color:var(--mut);font-size:14px;margin:4px 0 12px;min-height:38px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:800;font-size:19px}
.add{background:var(--acc);color:#fff;border-radius:99px;padding:10px 18px;font-weight:700}
.qty{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:99px;padding:3px}
.qty button{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:20px;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;background:linear-gradient(transparent,var(--bg) 40%)}
.btn{border-radius:99px;padding:16px 26px;font-weight:700;font-size:17px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.main{background:var(--acc);color:#fff;border:0}.btn.dark{background:var(--acc2);color:var(--bg);border:0}
.badge{background:#fff;color:var(--acc);border-radius:99px;padding:1px 9px;margin-inline-start:8px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(20,23,29,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:30px;padding:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.3,.4,1);text-align:center}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.sheet.l{text-align:start}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li .e{font-size:30px}.li .n{flex:1;font-weight:600}
.big{font-size:64px;margin:6px 0}
.tag{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.s-new{background:#ffe3df;color:#d93a2d}.s-prep{background:#fff0c7;color:#9a6b00}.s-ready{background:#d6f3e4;color:#1f7a50}
.apple-field{position:relative;height:340px;overflow:hidden;border-radius:22px;background:linear-gradient(#e8f5ff,#fff);touch-action:none;margin:14px 0}
.ap{position:absolute;top:-60px;font-size:46px;animation:fall 2.1s linear forwards;user-select:none}
@keyframes fall{to{top:340px}}.ap.pop{animation:boom .25s forwards}@keyframes boom{to{transform:scale(1.8);opacity:0}}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);width:100%;transition:width .2s linear}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:start}
.col h2{font-size:17px;margin:0 0 10px}.oc{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);animation:up .4s both}
.oc.fresh{outline:3px solid var(--acc);animation:flash 1s 3}@keyframes flash{50%{background:#ffe3df}}
.tabs{display:flex;gap:8px;margin:18px 0}.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pin button{padding:18px;border-radius:18px;background:var(--bg);font-size:24px;font-weight:700}
.dots{font-size:30px;letter-spacing:10px;height:42px}
.fld{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);margin:5px 0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:14px 24px;border-radius:99px;font-weight:700;z-index:99;box-shadow:var(--sh);animation:pop .3s}
.fly{position:fixed;font-size:40px;z-index:99;animation:flyaway 1.1s forwards}@keyframes flyaway{to{transform:translate(-120px,-70vh) scale(.3) rotate(40deg);opacity:0}}
@keyframes bob{to{transform:translateY(-18px) rotate(10deg)}}.rdy{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card) 40%,#ffd9d1)}.rdy>*:not(.cf){position:relative}.cf{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:cfall 3s linear infinite}@keyframes cfall{to{top:110%;transform:rotate(360deg)}}.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:6px 0}.dp button{height:48px;border-radius:14px;background:var(--bg);font-size:20px}.spin{width:60px;height:60px;border:6px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite;margin:14px auto}@keyframes rot{to{transform:rotate(360deg)}}.ck{width:90px;height:90px;border-radius:50%;background:var(--ok);color:#fff;font-size:52px;display:grid;place-items:center;margin:10px auto;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.sum{font-size:64px;font-weight:800;color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div><div id="ov"></div>
<script>
const KEY='koi_v1';
const DEF={menu:[
{id:1,n:'ניגירי סלמון',e:'🍣',d:'פרוסת סלמון טרי על אורז מתובל',p:14,c:'ניגירי'},
{id:2,n:'ניגירי טונה',e:'🍣',d:'טונה אדומה עדינה וקלילה',p:16,c:'ניגירי'},
{id:3,n:'ניגירי שרימפס',e:'🍤',d:'שרימפס מאודה על אורז',p:15,c:'ניגירי'},
{id:4,n:'קליפורניה רול',e:'🍙',d:'סרטן, אבוקדו ומלפפון בציפוי שומשום',p:28,c:'רולים'},
{id:5,n:'ספייסי טונה רול',e:'🍥',d:'טונה חריפה עם בצל ירוק',p:32,c:'רולים'},
{id:6,n:'גיוזה',e:'🥟',d:'כיסוני עוף מטוגנים בקצה פריך',p:24,c:'חם'},
{id:7,n:'אדממה',e:'🫛',d:'פולי סויה עם מלח ים',p:16,c:'חם'},
{id:8,n:'תה ירוק',e:'🍵',d:'תה ירוק חם בקנקן',p:12,c:'שתייה'},
{id:9,n:'לימונדה',e:'🥤',d:'לימונדה קרה עם נענע',p:14,c:'שתייה'},
{id:10,n:'מוצ׳י',e:'🍡',d:'שלושה כדורי מוצ׳י במילוי גלידה',p:22,c:'קינוחים'}],
prizes:['קינוח חינם 🍡','שתייה חינם 🥤','גיוזה חינם 🥟'],
orders:[],seq:100,
sess:{code:'SK-'+Math.floor(1000+Math.random()*9000),plates:0,games:0,prizes:[],co:false,paid:false}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let mode='c',cat='הכל',cart={},sheet=null,tab='orders',pin='',fresh=new Set(),muted=false,payAnim=null,payCode='';
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;');
const $=s=>document.querySelector(s),m=n=>'₪'+n;
const total=o=>o.reduce((a,i)=>a+i.p*i.q,0);
const allItems=()=>{const r={};S.orders.forEach(o=>o.items.forEach(i=>{r[i.id]=r[i.id]||{...i,q:0};r[i.id].q+=i.q}));return Object.values(r)};
const cartItems=()=>Object.entries(cart).filter(([id])=>S.menu.find(x=>x.id==id)).map(([id,q])=>({...S.menu.find(x=>x.id==id),q}));
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);

/* sound */
let AC;const tn=(f,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.15,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d+.05)};
function chime(){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();[0,.22].forEach(t=>{tn(1319,t,.7,'sine',.2);tn(3640,t,.3,'sine',.05)});[[523,.7],[659,.95],[784,1.2],[1047,1.45]].forEach(([f,t])=>tn(f,t,.3,'triangle',.16));[1047,1319,1568].forEach(f=>tn(f,1.9,1.1,'sine',.1));[2093,2637,3136,2637,3136,4186].forEach((f,i)=>tn(f,2+i*.1,.2,'sine',.04))}catch(e){}}
function ding(){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.15;o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.35)})}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

/* render */
function render(){const a=$('#app');a.innerHTML=mode==='c'?customer():worker();$('#ov').innerHTML=overlay();afterRender()}
function topbar(){return `<div class="top"><div class="brand">קוי<b>.</b> <span style="font-weight:400;font-size:15px;color:var(--mut)">שולחן 7</span></div><div style="display:flex;gap:8px"><button class="pill" onclick="muted=!muted;render()">${muted?'🔇':'🔊'}</button><button class="pill" onclick="${mode==='c'?"openSheet('pin')":"mode='c';render()"}">${mode==='c'?'👤 עובד':'← ללקוח'}</button></div></div>`}
function customer(){
const cats=['הכל',...new Set(S.menu.map(x=>x.c))],list=S.menu.filter(x=>cat==='הכל'||x.c===cat);
const act=S.orders.filter(o=>o.status!=='done').length;
return `<div class="wrap">${topbar()}
<div class="hero"><h1>מה בא לכם לאכול? 🍣</h1><p>בחרו, הזמינו, ונביא אליכם לשולחן. כל 3 צלחות – משחק עם פרס.</p></div>
<div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div>
<div class="grid">${list.map((x,i)=>`<div class="card" style="animation-delay:${i*40}ms"><div class="pic" ${x.img?`style="background-image:url(${x.img})"`:''} onclick="openSheet('dish',${x.id})">${x.img?'':x.e}</div><div class="cb"><h3>${x.n}</h3><p>${x.d}</p><div class="row"><span class="price">${m(x.p)}</span>${cart[x.id]?`<div class="qty"><button onclick="chg(${x.id},-1)">−</button><b>${cart[x.id]}</b><button onclick="chg(${x.id},1,event)">+</button></div>`:`<button class="add" onclick="chg(${x.id},1,event)">הוספה +</button>`}</div></div></div>`).join('')}</div></div>
<div class="bar">${S.orders.length?`<button class="btn" onclick="openSheet('track')">📋 ההזמנות שלי ${act?`<span class="badge" style="background:var(--acc);color:#fff">${act}</span>`:''}</button>`:''}
<button class="btn main" onclick="openSheet('cart')">🛒 הסל <span class="badge">${cnt()}</span> ${cnt()?m(total(cartItems())):''}</button>
${S.orders.length?`<button class="btn dark" onclick="openSheet('co')">Checkout</button>`:''}</div>`}
function chg(id,d,ev){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];if(d>0&&ev){const f=document.createElement('div');f.className='fly';f.textContent=S.menu.find(x=>x.id==id).e;f.style.left=ev.clientX+'px';f.style.top=ev.clientY+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}render()}
function openSheet(s,x){sheet=s;if(s==='dish')window._d=x;if(s==='pin')pin='';render()}
function close_(){sheet=null;render()}
function overlay(){
const w=h=>`<div class="ov" onclick="if(event.target===this)close_()">${h}</div>`;
if(sheet==='dish'){const x=S.menu.find(i=>i.id==window._d);return w(`<div class="sheet"><div class="big" style="font-size:110px">${x.img?`<img src="${x.img}" style="width:100%;border-radius:22px">`:x.e}</div><h2>${x.n}</h2><p style="color:var(--mut)">${x.d}</p><div class="price" style="font-size:28px">${m(x.p)}</div><br><button class="btn main" onclick="chg(${x.id},1,event);close_()">הוספה לסל</button></div>`)}
if(sheet==='cart'){const it=cartItems();return w(`<div class="sheet l"><h2>הסל שלי</h2>${it.length?it.map(i=>`<div class="li"><span class="e">${i.e}</span><span class="n">${i.n}<br><small style="color:var(--mut)">${m(i.p)} ליחידה</small></span><div class="qty"><button onclick="chg(${i.id},-1)">−</button><b>${i.q}</b><button onclick="chg(${i.id},1)">+</button></div><b style="min-width:54px;text-align:left">${m(i.p*i.q)}</b></div>`).join('')+`<div class="row" style="margin:18px 0"><b>סה״כ</b><span class="sum" style="font-size:32px">${m(total(it))}</span></div><button class="btn main" style="width:100%" onclick="sendOrder()">הזמנה 🍣</button>`:'<p style="color:var(--mut)">הסל ריק. בחרו משהו טעים 🙂</p>'}</div>`)}
if(sheet==='sending')return `<div class="ov"><div class="sheet"><div class="big" style="animation:bob .5s infinite alternate">🍣</div><h2>שולחים למטבח...</h2><style>@keyframes bob{to{transform:translateY(-18px) rotate(10deg)}}</style></div></div>`;
if(sheet==='sent')return w(`<div class="sheet"><div class="ck">✓</div><h2 style="font-size:30px;margin:6px 0">ההזמנה שלכם התקבלה!</h2><p style="color:var(--mut)">הזמנה #${S.seq} · אנחנו כבר מתחילים להכין 🍣<br>נעדכן אתכם ברגע שהאוכל מוכן</p><button class="btn main" onclick="close_()">להמשיך להזמין</button></div>`);
if(sheet==='track')return w(`<div class="sheet l"><h2>ההזמנות שלי</h2>${S.orders.slice().reverse().map(o=>`<div class="li" style="display:block"><div class="row"><b>הזמנה #${o.id}</b>${tag(o.status)}</div><div style="color:var(--mut);margin-top:4px">${o.items.map(i=>`${i.q}× ${i.n}`).join(' · ')}</div></div>`).join('')||'<p>אין הזמנות עדיין</p>'}<p style="text-align:center;color:var(--mut)">🍎 צלחות שהגיעו: ${S.sess.plates} · משחק הבא אחרי ${3-(S.sess.plates%3)}</p>${S.sess.prizes.length?`<p>🎁 הפרסים שלי: ${S.sess.prizes.join(', ')}</p>`:''}</div>`);
if(sheet==='ready')return `<div class="ov"><div class="sheet rdy">${Array.from({length:14},(_,i)=>`<i class="cf" style="left:${(i*7+3)%100}%;animation-delay:${(i%5)*.25}s">${['🍣','✨','🎉','🍙','⭐'][i%5]}</i>`).join('')}<div class="big" style="font-size:96px;animation:bob .6s infinite alternate">🍣</div><h2 style="font-size:36px;margin:4px 0">האוכל שלכם מוכן!</h2><p>הזמנה #${window._r} בדרך לשולחן · בתיאבון 🥢</p><button class="btn main" onclick="afterReady()">מעולה!</button></div></div>`;
if(sheet==='gameIntro')return `<div class="ov"><div class="sheet"><div class="big">🎮</div><h2>הגיע זמן למשחק!</h2><p style="color:var(--mut)">בחרו משחק וזכו בפרס.<br>🍎 תפסו שליש מהתפוחים · 🐍 אכלו 5 ניגירי עם הנחש</p><button class="btn main" onclick="startGame()">🍎 תפוס תפוחים</button> <button class="btn dark" onclick="startSnake()">🐍 נחש</button><br><br><button class="pill" onclick="close_()">אחר כך</button></div></div>`;
if(sheet==='snake')return `<div class="ov"><div class="sheet"><div class="row"><b>🐍 נחש</b><b>🍣 <span id="ss">0</span>/5</b></div><canvas id="sc" width="330" height="330" style="max-width:100%;border-radius:18px;margin:12px 0;touch-action:none"></canvas><div class="dp"><span></span><button onclick="_sd({x:0,y:-1})">▲</button><span></span><button onclick="_sd({x:1,y:0})">◀</button><button onclick="_sd({x:0,y:1})">▼</button><button onclick="_sd({x:-1,y:0})">▶</button></div><button class="pill" onclick="clearInterval(snk);sheet=null;render()">יציאה</button></div></div>`;
if(sheet==='game')return `<div class="ov"><div class="sheet"><div class="row"><b>🍎 <span id="gs">0</span></b><b id="gt">12</b></div><div class="prog"><i id="gp"></i></div><div class="apple-field" id="gf"></div></div></div>`;
if(sheet==='gameEnd'){const g=window._g;return `<div class="ov"><div class="sheet"><div class="big">${g.win?'🎉':'🍎'}</div><h2>${g.win?'כל הכבוד!':g.snake?'כמעט! נסו שוב בפעם הבאה 🐍':'כמעט! אולי בפעם הבאה 🍎'}</h2><p>${g.snake?'אכלתם':'תפסתם'} ${g.c} מתוך ${g.n}</p>${g.win?`<p style="font-size:22px"><b>זכית במשהו בחינם!</b><br>${g.prize}</p>`:''}<button class="btn main" onclick="close_()">להמשיך</button></div></div>`}
if(sheet==='co')return w(`<div class="sheet"><h2>לסיים את הארוחה?</h2><p style="color:var(--mut)">סה״כ עד עכשיו: ${m(total(allItems()))}</p><button class="btn main" onclick="doCheckout()">Checkout</button> <button class="btn" onclick="close_()">עוד לא</button></div>`);
if(sheet==='qr')return `<div class="ov"><div class="sheet"><h2>תבואו לקבלה לתשלום</h2><div id="qr" style="display:inline-block;padding:14px;background:#fff;border-radius:18px;margin:10px"></div><div style="font-size:26px;font-weight:800;letter-spacing:3px">${S.sess.code}</div><p style="color:var(--mut)">הראו את הקוד לעובד</p>${S.sess.prizes.length?`<p>🎁 ${S.sess.prizes.join(', ')}</p>`:''}${S.sess.paid?`<p style="color:var(--ok);font-weight:700">שולם ✔ תודה ולהתראות!</p>`:''}<button class="btn" onclick="S.sess.co=false;save();close_()">חזרה לתפריט</button></div></div>`;
if(sheet==='pin')return w(`<div class="sheet"><h2>כניסת עובד</h2><div class="dots">${'●'.repeat(pin.length)||'&nbsp;'}</div><div class="pin">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="pk('${k}')">${k}</button>`).join('')}</div></div>`);
if(sheet==='add'||sheet==='edit'){const ed=sheet==='edit',x=ed?S.menu.find(i=>i.id==window._e):{n:'',d:'',p:'',c:'',e:''};return w(`<div class="sheet l"><h2>${ed?'עריכת מנה':'+ הוסף מנה'}</h2><input class="fld" id="an" placeholder="שם" value="${esc(x.n)}"><input class="fld" id="ad" placeholder="תיאור" value="${esc(x.d)}"><input class="fld" id="ap" type="number" placeholder="מחיר ₪" value="${esc(x.p)}"><input class="fld" id="ac" placeholder="קטגוריה (למשל ניגירי)" value="${esc(x.c)}"><input class="fld" id="ae" placeholder="אימוג׳י (אם אין תמונה)" maxlength="2" value="${esc(ed?x.e:'')}">${ed&&x.img?`<img src="${x.img}" style="width:100%;border-radius:16px;margin:6px 0"><label><input type="checkbox" id="ar"> הסר תמונה נוכחית</label>`:''}<div style="color:var(--mut);font-size:13px;margin-top:6px">${ed?'להחלפת תמונה:':'תמונה:'}</div><input class="fld" id="ai" type="file" accept="image/*"><br><button class="btn main" style="width:100%" onclick="addDish()">שמירה</button></div>`)}
if(sheet==='pay')return payOv();
return ''}
const tag=s=>`<span class="tag s-${s==='done'?'ready':s}">${{new:'התקבלה',prep:'בהכנה',ready:'מוכנה',done:'הוגשה'}[s]}</span>`;
function pk(k){if(k==='⌫')pin=pin.slice(0,-1);else if(k==='✓'||pin.length==3&&k!=='⌫'){if(k!=='✓')pin+=k;if(pin==='1212'){mode='w';sheet=null;pin='';render();return}if(pin.length>=4||k==='✓'){toast('קוד שגוי');pin=''}}else pin+=k;render()}
function sendOrder(){const it=cartItems();if(!it.length)return;sheet='sending';render();ding();setTimeout(()=>{S.seq++;S.orders.push({id:S.seq,items:it.map(i=>({id:i.id,n:i.n,e:i.e,p:i.p,q:i.q})),status:'new',seen:false,t:Date.now(),prizeAt:S.sess.prizes.slice()});cart={};save();sheet='sent';render()},1400)}
let queue=[];
function checkReady(){if(mode!=='c'||sheet==='game'||sheet==='snake'||sheet==='gameEnd'||sheet==='ready'||sheet==='gameIntro')return;const o=S.orders.find(o=>o.status==='ready'&&!o.seen);if(o){o.seen=true;window._r=o.id;S.sess.plates+=o.items.reduce((a,i)=>a+i.q,0);save();sheet='ready';chime();render()}}
function afterReady(){const due=Math.floor(S.sess.plates/3)>S.sess.games;sheet=due?'gameIntro':null;render()}
function startGame(){S.sess.games++;save();sheet='game';render();let c=0,n=0,t=12;const f=$('#gf');const sp=setInterval(()=>{if(!f)return;n++;const a=document.createElement('div');a.className='ap';a.textContent=Math.random()<.15?'🍏':'🍎';a.style.left=(Math.random()*84+4)+'%';a.onpointerdown=e=>{if(a.classList.contains('pop'))return;a.classList.add('pop');c++;$('#gs').textContent=c;setTimeout(()=>a.remove(),250)};a.onanimationend=()=>{if(!a.classList.contains('pop'))a.remove()};f.appendChild(a)},520);
const tm=setInterval(()=>{t--;$('#gt').textContent=Math.max(t,0);$('#gp').style.width=(t/12*100)+'%';if(t<=0){clearInterval(sp);clearInterval(tm);const win=c>=n/3,prize=S.prizes[Math.floor(Math.random()*S.prizes.length)];if(win){S.sess.prizes.push(prize);save()}window._g={c,n,win,prize};setTimeout(()=>{sheet='gameEnd';render()},900)}},1000)}
let snk;
function startSnake(){S.sess.games++;save();sheet='snake';render();const cv=$('#sc'),cx=cv.getContext('2d'),N=15,Z=22;let sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}],dir={x:1,y:0},nd=dir,eat=0,f;const place=()=>{do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(q=>q.x==f.x&&q.y==f.y))};place();
window._sd=d=>{if(d.x!==-dir.x||d.y!==-dir.y)nd=d};
const draw=()=>{for(let i=0;i<N;i++)for(let j=0;j<N;j++){cx.fillStyle=(i+j)%2?'#eef7ee':'#e3f1e3';cx.fillRect(i*Z,j*Z,Z,Z)}cx.font='19px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🍣',f.x*Z+Z/2,f.y*Z+Z/2+1);sn.forEach((q,i)=>{cx.fillStyle=i?'#2fa36b':'#1f7a50';cx.beginPath();cx.roundRect?cx.roundRect(q.x*Z+1,q.y*Z+1,Z-2,Z-2,7):cx.rect(q.x*Z+1,q.y*Z+1,Z-2,Z-2);cx.fill()})};
const end=win=>{clearInterval(snk);const prize=S.snakePrize||'ניגירי חינם 🍣';if(win){S.sess.prizes.push(prize);save()}window._g={c:eat,n:5,win,prize,snake:true};setTimeout(()=>{sheet='gameEnd';render()},500)};
let tx,ty;cv.ontouchstart=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY};cv.ontouchmove=e=>e.preventDefault();cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>20)_sd({x:Math.sign(dx),y:0});else if(Math.abs(dy)>20)_sd({x:0,y:Math.sign(dy)})};
document.onkeydown=e=>{const k={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];if(k&&sheet==='snake'){e.preventDefault();_sd(k)}};
clearInterval(snk);snk=setInterval(()=>{if(!$('#sc')){clearInterval(snk);return}dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(q=>q.x==h.x&&q.y==h.y)){draw();return end(false)}sn.unshift(h);if(h.x==f.x&&h.y==f.y){eat++;$('#ss').textContent=eat;if(eat>=5){draw();return end(true)}place()}else sn.pop();draw()},150);draw()}
function doCheckout(){S.sess.co=true;save();sheet='qr';render()}

/* worker */
function worker(){
const col=(t,s)=>`<div class="col"><h2>${t} (${S.orders.filter(o=>o.status===s).length})</h2>${S.orders.filter(o=>o.status===s).sort((a,b)=>b.t-a.t).map(oc).join('')}</div>`;
const sess=S.sess;
return `<div class="wrap">${topbar()}<div class="tabs"><button class="chip ${tab==='orders'?'on':''}" onclick="tab='orders';render()">הזמנות</button><button class="chip ${tab==='pay'?'on':''}" onclick="tab='pay';render()">תשלום ${sess.co&&!sess.paid?'🔴':''}</button><button class="chip ${tab==='menu'?'on':''}" onclick="tab='menu';render()">תפריט ופרסים</button></div>
${tab==='orders'?`${sess.prizes.length?`<div class="oc">🎁 לשולחן 7 מגיע: <b>${sess.prizes.join(', ')}</b></div>`:''}<div class="wk">${col('חדשות','new')}${col('בהכנה','prep')}${col('מוכנות','ready')}</div>`:''}
${tab==='pay'?`<div class="oc"><h2>סריקת קוד לקוח</h2><div class="row"><input class="fld" id="pc" placeholder="SK-1234" value="${payCode}" style="flex:1"><button class="btn main" onclick="payGo($('#pc').value)">פתח</button></div></div>
<h3>ממתינים לתשלום</h3>${sess.co&&!sess.paid?`<div class="oc row"><div><b>שולחן 7</b> · ${sess.code}<br><small>${m(total(allItems()))}</small></div><button class="btn dark" onclick="payGo('${sess.code}')">פתח חשבון</button></div>`:'<p style="color:var(--mut)">אין כרגע</p>'}
${sess.paid?`<button class="btn" onclick="newCust()">שולחן חדש (איפוס לקוח)</button>`:''}`:''}
${tab==='menu'?`<button class="btn main" onclick="openSheet('add')">+ הוסף מנה</button><div class="oc" style="margin-top:16px"><h2>פרסים (${S.prizes.length})</h2>${S.prizes.map((p,i)=>`<div class="li"><input class="fld n" value="${esc(p)}" onchange="S.prizes[${i}]=this.value;save()"><button class="pill" onclick="S.prizes.splice(${i},1);save();render()">הסר</button></div>`).join('')}<div class="row" style="margin-top:10px"><input class="fld" id="np" placeholder="פרס חדש"><button class="btn" onclick="if($('#np').value){S.prizes.push($('#np').value);save();render()}">הוסף</button></div></div>
<div class="oc"><h2>מנות</h2><input type="file" id="qi" accept="image/*" hidden onchange="qImg(this)">${S.menu.map(x=>`<div class="li" style="flex-wrap:wrap"><span class="e">${x.img?`<img src="${x.img}" style="width:48px;height:48px;object-fit:cover;border-radius:12px">`:x.e}</span><span class="n">${x.n} · ${m(x.p)}<br><small style="color:var(--mut)">${x.c}</small></span><button class="pill" onclick="window._qi=${x.id};$('#qi').click()">🖼️ תמונה</button><button class="pill" onclick="window._e=${x.id};openSheet('edit')">✏️ ערוך</button><button class="pill" style="color:#d93a2d" onclick="delDish(${x.id})">${window._del===x.id?'בטוח? לחץ שוב':'🗑️ מחק'}</button></div>`).join('')}</div>`:''}</div>`}
function oc(o){return `<div class="oc ${fresh.has(o.id)?'fresh':''}"><div class="row"><b>הזמנה #${o.id}</b>${tag(o.status)}</div><div style="margin:10px 0">${o.items.map(i=>`<div>${i.e} ${i.q}× ${i.n}</div>`).join('')}</div><div class="row"><b>סה״כ: ${m(total(o.items))}</b>${o.status==='new'?`<button class="add" onclick="setSt(${o.id},'prep')">התחל הכנה</button>`:o.status==='prep'?`<button class="add" style="background:var(--ok)" onclick="setSt(${o.id},'ready')">מוכן</button>`:''}</div></div>`}
function setSt(id,s){S.orders.find(o=>o.id===id).status=s;fresh.delete(id);save();render()}
function qImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,500/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.menu.find(x=>x.id==window._qi).img=c.toDataURL('image/jpeg',.7);save();render();toast('התמונה עודכנה')};im.src=r.result};r.readAsDataURL(f)}
function delDish(id){if(window._del===id){S.menu=S.menu.filter(x=>x.id!=id);delete cart[id];window._del=null;save();render();return}window._del=id;render();setTimeout(()=>{if(window._del===id){window._del=null;render()}},3000)}
function addDish(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return toast('חסר שם או מחיר');const ed=sheet==='edit'?S.menu.find(i=>i.id==window._e):null,f=$('#ai').files[0];const fin=img=>{const o={n,d:$('#ad').value||'',p,c:$('#ac').value||'אחר',e:$('#ae').value||(ed?ed.e:'🍣')};if(ed){Object.assign(ed,o);if($('#ar')&&$('#ar').checked)delete ed.img;if(img)ed.img=img}else S.menu.push({id:Date.now(),...o,img});save();sheet=null;render()};if(!f)return fin();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,500/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);fin(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
function payGo(code){if(code.trim().toUpperCase()!==S.sess.code)return toast('קוד לא נמצא');payAnim=0;sheet='pay';tab='pay';render();setTimeout(()=>{payAnim=1;render();ding()},1300);setTimeout(()=>{payAnim=2;render();countUp()},2800)}
function countUp(){const T=total(allItems());let v=0;const el=$('#cu');const iv=setInterval(()=>{v=Math.min(T,v+Math.ceil(T/25));if($('#cu'))$('#cu').textContent=m(v);if(v>=T)clearInterval(iv)},40)}
function payOv(){const it=allItems(),T=total(it);
const box=h=>`<div class="ov"><div class="sheet">${h}</div></div>`;
if(payAnim===0)return box(`<div class="big" style="animation:bob .5s infinite alternate">📱</div><h2>קורא קוד...</h2>`);
if(payAnim===1)return box(`<div class="big" style="animation:bob .5s infinite alternate">🧾</div><h2>מחשב חשבון...</h2>`);
if(payAnim===3)return box(`<div style="background:linear-gradient(135deg,#1e2430,#ff5a4e);color:#fff;border-radius:20px;padding:20px;text-align:left;direction:ltr;margin-bottom:14px"><div style="font-size:26px">💳</div><div id="cvn" style="font-size:22px;letter-spacing:2px;margin:16px 0">•••• •••• •••• ••••</div><div class="row"><span id="cvh">CARD HOLDER</span><span id="cve">MM/YY</span></div></div>
<input class="fld" id="cn" inputmode="numeric" placeholder="מספר כרטיס" oninput="cardIn()" style="direction:ltr"><input class="fld" id="ch" placeholder="שם בעל הכרטיס" oninput="cardIn()" style="direction:ltr"><div class="row"><input class="fld" id="ce" inputmode="numeric" placeholder="MM/YY" oninput="cardIn()" style="direction:ltr"><input class="fld" id="cc" inputmode="numeric" placeholder="CVV" maxlength="3" style="direction:ltr"></div>
<button class="pill" onclick="fillDemo()">✨ מלא פרטי דמו</button><br><br><button class="btn main" style="width:100%" onclick="payCard()">שלם ${m(T)}</button><br><br><button class="pill" onclick="payAnim=2;render();countUp()">חזרה</button><div style="color:var(--mut);font-size:12px;margin-top:8px">דמו בלבד – לא מתבצע חיוב אמיתי</div>`);
if(payAnim===4)return box(`<div class="spin"></div><h2>מעבד תשלום...</h2><p style="color:var(--mut)">מתקשר עם חברת האשראי</p>`);
if(payAnim===5)return box(`<div class="ck">✓</div><h2>התשלום אושר!</h2><div class="sum" style="font-size:44px">${m(T)}</div><p style="color:var(--mut)">${window._card?'כרטיס •••• '+window._card+' · ':''}אישור #${Math.floor(100000+Math.random()*899999)}</p><button class="btn main" onclick="sheet=null;payAnim=null;render()">סיום</button>`);
return `<div class="ov"><div class="sheet l"><div style="text-align:center">💳 סכום לתשלום<div class="sum" id="cu">${m(0)}</div></div>${it.map(i=>`<div class="li"><span class="e">${i.e}</span><span class="n">${i.q}× ${i.n}</span><b>${m(i.p*i.q)}</b></div>`).join('')}${S.sess.prizes.length?`<p>🎁 פרסים לטיפול: <b>${S.sess.prizes.join(', ')}</b></p>`:''}<button class="btn main" style="width:100%" onclick="payAnim=3;window._card='';render()">💳 תשלום בכרטיס אשראי</button><br><br><button class="btn" style="width:100%" onclick="S.sess.paid=true;save();sheet=null;payAnim=null;render();toast('שולם במזומן (דמו)')">💵 מזומן</button></div></div>`}
function cardIn(){const n=$('#cn'),e=$('#ce');n.value=n.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();let d=e.value.replace(/\D/g,'').slice(0,4);e.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;$('#cvn').textContent=(n.value+'                   ').slice(0,19).replace(/ /g,' ').replace(/[^\d ]/g,'')||'•••• •••• •••• ••••';if(!n.value)$('#cvn').textContent='•••• •••• •••• ••••';$('#cvh').textContent=($('#ch').value||'CARD HOLDER').toUpperCase();$('#cve').textContent=e.value||'MM/YY'}
function fillDemo(){$('#cn').value='4242 4242 4242 4242';$('#ch').value='Demo Customer';$('#ce').value='12/28';$('#cc').value='123';cardIn()}
function payCard(){const n=$('#cn').value;if(n.length<19)return toast('מספר כרטיס לא מלא');if($('#ce').value.length<5)return toast('תוקף לא מלא');if($('#cc').value.length<3)return toast('חסר CVV');window._card=n.slice(-4);payAnim=4;render();setTimeout(()=>{S.sess.paid=true;save();payAnim=5;render();ding()},2200)}
function newCust(){S.orders=[];S.sess={code:'SK-'+Math.floor(1000+Math.random()*9000),plates:0,games:0,prizes:[],co:false,paid:false};cart={};save();render()}
function afterRender(){const q=$('#qr');if(q&&window.QRCode&&!q.firstChild)new QRCode(q,{text:S.sess.code,width:200,height:200});checkReady()}

/* sync between tabs/devices on same browser */
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const old=S.orders.map(o=>o.id);try{S=JSON.parse(e.newValue)}catch(x){return}
if(mode==='w'){const nw=S.orders.filter(o=>!old.includes(o.id));if(nw.length){nw.forEach(o=>fresh.add(o.id));ding();toast('🔔 הזמנה חדשה #'+nw[0].id);try{if('Notification'in window&&Notification.permission==='granted')new Notification('הזמנה חדשה #'+nw[0].id)}catch(x){}}}
if(sheet==='game'||sheet==='snake'||(sheet==='pay'&&payAnim>=3))return;render()});
try{if(location.protocol.startsWith('http')&&'Notification'in window&&Notification.permission==='default')document.addEventListener('click',()=>Notification.requestPermission(),{once:true})}catch(e){}
render();
</script>
</body>
</html>
